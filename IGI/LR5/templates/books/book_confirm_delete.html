{% extends 'base.html' %}

{% block title %}Удаление книги{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h1>Удаление книги</h1>
        <p>Вы уверены, что хотите удалить книгу "{{ book.title }}"?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'books:book-list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
